services:
  echoguide-guard:
    build:
      context: ${ECHOGUIDE_GUARD_ROOT}
      dockerfile: echoguide_guard/Dockerfile
    environment:
      ECHOGUIDE_TARGET: /target
      ECHOGUIDE_AUDIT_DB: /data/echoguide_guard.sqlite3
      ECHOGUIDE_JWT_SECRET: ${JWT_SECRET:-change-me-weak-secret}
      ECHOGUIDE_AGENT_UPSTREAM: http://opspilot-app:8000
      ECHOGUIDE_LLM_UPSTREAM: http://llm-stub:8000
      ECHOGUIDE_LANGFLOW_UPSTREAM: http://langflow:7860
    volumes:
      - .:/target:ro
      - echoguide-guard-data:/data
    ports:
      - "8200:8200"
    networks:
      - opspilot-net
    restart: unless-stopped

  opspilot-app:
    environment:
      LLM_BASE: http://echoguide-guard:8200/v1
      MCP_CUSTOMER_DB: http://echoguide-guard:8200/mcp/customer-db
      MCP_SHELL_RUNNER: http://echoguide-guard:8200/mcp/shell-runner
      MCP_NOTES_SYNC: http://echoguide-guard:8200/mcp/notes-sync
      MCP_THREAT_INTEL: http://echoguide-guard:8200/mcp/threat-intel
      MCP_GITLAB: http://echoguide-guard:8200/mcp/gitlab
      MCP_MONITORING: http://echoguide-guard:8200/mcp/monitoring
      MCP_KNOWLEDGE: http://echoguide-guard:8200/mcp/knowledge
      MCP_SANDBOX_EXEC: http://echoguide-guard:8200/mcp/sandbox-exec
    depends_on:
      echoguide-guard:
        condition: service_started

  # AgentRange publishes the replay-control LLM endpoint on 8000 by default.
  # Keep it reachable without colliding with XDU-EchoGuide or another local API.
  llm-stub:
    ports: !override
      - "${AGENTRANGE_LLM_PORT:-18000}:8000"

volumes:
  echoguide-guard-data:
