services:
  echoguard:
    build:
      context: ${ECHOGUARD_ROOT}
      dockerfile: echoguard/Dockerfile
    environment:
      ECHOGUARD_TARGET: /target
      ECHOGUARD_AUDIT_DB: /data/echoguard.sqlite3
      ECHOGUARD_JWT_SECRET: ${JWT_SECRET:-change-me-weak-secret}
      ECHOGUARD_AGENT_UPSTREAM: http://opspilot-app:8000
      ECHOGUARD_LLM_UPSTREAM: http://llm-stub:8000
      ECHOGUARD_LANGFLOW_UPSTREAM: http://langflow:7860
    volumes:
      - .:/target:ro
      - echoguard-data:/data
    ports:
      - "8200:8200"
    networks:
      - opspilot-net
    restart: unless-stopped

  opspilot-app:
    environment:
      LLM_BASE: http://echoguard:8200/v1
      MCP_CUSTOMER_DB: http://echoguard:8200/mcp/customer-db
      MCP_SHELL_RUNNER: http://echoguard:8200/mcp/shell-runner
      MCP_NOTES_SYNC: http://echoguard:8200/mcp/notes-sync
      MCP_THREAT_INTEL: http://echoguard:8200/mcp/threat-intel
      MCP_GITLAB: http://echoguard:8200/mcp/gitlab
      MCP_MONITORING: http://echoguard:8200/mcp/monitoring
      MCP_KNOWLEDGE: http://echoguard:8200/mcp/knowledge
      MCP_SANDBOX_EXEC: http://echoguard:8200/mcp/sandbox-exec
    depends_on:
      echoguard:
        condition: service_started

  # AgentRange publishes the replay-control LLM endpoint on 8000 by default.
  # Keep it reachable without colliding with EchoMind or another local API.
  llm-stub:
    ports: !override
      - "${AGENTRANGE_LLM_PORT:-18000}:8000"

volumes:
  echoguard-data:
