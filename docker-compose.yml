# EchoGuide 智能客服系统 — Docker Compose 服务编排
# 三级记忆架构：Redis（工作记忆）+ ChromaDB（情景记忆 + 用户画像）

services:

  # ── Redis 缓存（工作记忆）────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: echoguide-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-echoguide123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - echoguide-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-echoguide123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库（情景记忆 + 用户画像）────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: echoguide-chromadb
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - echoguide-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus 监控 ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: echoguide-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 告警规则目录（prometheus.yml 的 rule_files 指向 alerts/*.yml）
      - ./config/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - echoguide-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── EchoGuide 主应用 ─────────────────────────────────────────────────────────
  echoguide:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: echoguide-app
    ports:
      # 外部端口 8100（避免与宿主机其他项目占用 8000 冲突），容器内部仍为 8000
      - "8100:8000"
    env_file:
      - .env
    environment:
      # 容器内固定值，覆盖 .env 中的本地路径
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://:${REDIS_PASSWORD:-echoguide123}@redis:6379/0
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - ECHOGUIDE_SKILLS_DIR=/app/skills
      - ECHOGUIDE_DB_PATH=/app/data/echoguide.db
      - ECHOGUIDE_PUBLIC_DATA_DIR=/app/data/public
    volumes:
      # 挂载整个 data 目录：SQLite 个人数据（echoguide.db）与公开信息
      # 在容器内自动创建，避免 bind mount 不存在的文件被 Docker 建为目录
      - ./data:/app/data
      - ./skills:/app/skills
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - echoguide-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx 统一入口（前端页面 + API 转发）────────────────────────────────────
  # 80 端口可能被其他软件占用，因此外部使用 8088；容器内部仍为 80
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echoguide-nginx
    ports:
      - "8088:80"
    volumes:
      - nginx-logs:/var/log/nginx
    depends_on:
      echoguide:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - echoguide-network
    healthcheck:
      # 用 127.0.0.1 而非 localhost：alpine 中 localhost 解析为 ::1（IPv6），
      # 而 nginx 只监听 IPv4，会导致健康检查误判失败
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  echoguide-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  chromadb-data:
  prometheus-data:
  nginx-logs:
